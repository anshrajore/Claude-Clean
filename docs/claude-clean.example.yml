version: 1

profile: balanced

confidence:
  automaticRemoval: 0.99
  preview: 0.90
  report: 0.70

processing:
  includeCode: false
  backup: false
  maxFileBytes: 10485760
  maxDeletionRatio: 0.5

output:
  suffix: ".cleaned"

rules:
  enabled:
    - claude
    - generic
    - custom

ignore:
  - node_modules
  - dist
  - coverage
  - "*.min.js"
